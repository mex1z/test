<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#10101f" />
<title>Deepmine — pixel mine &amp; wave arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2310101f'/><rect x='3' y='3' width='4' height='4' fill='%23ffd447'/><rect x='9' y='3' width='4' height='4' fill='%23b58cff'/><rect x='3' y='9' width='10' height='4' fill='%234ecbd8'/></svg>" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #08070f;
    overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 22%, #241d3a 0%, #131120 46%, #08070f 100%);
  }
  #stage {
    position: relative;
    line-height: 0;
    filter: drop-shadow(0 0 42px rgba(120, 96, 220, 0.28));
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #10101f;
    border: 3px solid #3a3358;
    border-radius: 2px;
    cursor: none;
    touch-action: none;
    user-select: none;
  }
  #hint {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #5f5a80;
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.4;
    text-align: center;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0b0a14;
    color: #ff9db1;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: center;
    z-index: 10;
  }
  #friends-btn {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 5;
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 10px;
    background: #2a2344;
    color: #d9d2ff;
    border: 2px solid #3a3358;
    border-radius: 2px;
    cursor: pointer;
  }
  #friends-btn:hover { background: #342b55; }
  #lobby {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 7, 15, 0.78);
  }
  #lobby[hidden] { display: none; }
  .lobby-box {
    width: min(440px, 92vw);
    background: #17142a;
    border: 3px solid #3a3358;
    border-radius: 2px;
    padding: 18px 20px;
    color: #e8e4ff;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 0 40px rgba(120, 96, 220, 0.3);
  }
  .lobby-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #ffd447;
  }
  .lobby-box p { margin: 6px 0; color: #a49fc6; }
  .lobby-box label { display: block; margin-top: 8px; color: #a49fc6; font-size: 12px; }
  .lobby-box input {
    font: inherit;
    background: #0d0b19;
    color: #f2f0ff;
    border: 2px solid #3a3358;
    padding: 6px 8px;
    width: 100%;
    margin: 4px 0 8px;
  }
  .lobby-row { display: flex; gap: 6px; align-items: center; }
  .lobby-row input { margin: 0; width: auto; flex: 1; text-transform: uppercase; }
  .lobby-box button {
    font: inherit;
    font-size: 12px;
    background: #2a2344;
    color: #e8e4ff;
    border: 2px solid #3a3358;
    padding: 6px 10px;
    margin: 4px 6px 4px 0;
    cursor: pointer;
  }
  .lobby-box button:hover { background: #3a3160; }
  .lobby-box button:disabled { opacity: 0.5; cursor: default; }
  .lobby-code { font-size: 30px; letter-spacing: 8px; color: #ffd447; margin: 8px 0; }
  .lobby-box ul { margin: 6px 0; padding-left: 18px; }
  .lobby-msg { margin-top: 10px; min-height: 1.5em; }
  @media (max-width: 640px) {
    #hint { display: none; }
    canvas#game { border-width: 2px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="576" aria-label="Deepmine game canvas"></canvas>
  </div>
  <button id="friends-btn" type="button">FRIENDS (CO-OP)</button>
  <div id="lobby" hidden>
    <div class="lobby-box" role="dialog" aria-labelledby="lobby-title">
      <div class="lobby-head"><span id="lobby-title">CO-OP</span><button id="lobby-close" type="button">CLOSE</button></div>
      <div id="lobby-body"></div>
    </div>
  </div>
  <div id="hint">WASD / ARROWS to move &nbsp;·&nbsp; CLICK or SPACE to attack/mine &nbsp;·&nbsp; E portal &nbsp;·&nbsp; ESC pause &nbsp;·&nbsp; M sound</div>
  <div id="fatal"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
